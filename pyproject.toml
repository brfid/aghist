[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "aghist"
version = "0.1.0"
description = "Bounded agent teams for historical case research"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
aghist = "aghist.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

